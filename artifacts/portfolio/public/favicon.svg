<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Terracotta circle background -->
  <circle cx="50" cy="50" r="50" fill="#AA5022"/>

  <!--
    Brain+Shield icon scaled/shifted to fit inside the circle.
    All coordinates mapped from 0-0/100-105 viewBox → fitted into circle.
    Translate +4 on X, scale slightly, center vertically.
  -->
  <g transform="translate(2, 2) scale(0.94)">

    <!-- CENTER DIVIDER -->
    <line x1="50" y1="8" x2="50" y2="97"
          stroke="#F2EBE0" stroke-width="3" stroke-linecap="round"/>

    <!-- RIGHT HALF: Shield outline -->
    <path d="M50,8 Q66,6 78,17 Q89,28 87,51 Q85,70 72,84 Q62,92 50,96"
          fill="none" stroke="#F2EBE0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Circuit connector -->
    <line x1="50" y1="52" x2="59" y2="52"
          stroke="#F2EBE0" stroke-width="3" stroke-linecap="round"/>
    <!-- Vertical trunk -->
    <line x1="59" y1="35" x2="59" y2="69"
          stroke="#F2EBE0" stroke-width="3" stroke-linecap="round"/>
    <!-- Top branch + node -->
    <line x1="59" y1="35" x2="77" y2="35"
          stroke="#F2EBE0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="35" r="4" fill="#F2EBE0"/>
    <!-- Middle branch + node -->
    <line x1="59" y1="52" x2="79" y2="52"
          stroke="#F2EBE0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="82" cy="52" r="4" fill="#F2EBE0"/>
    <!-- Bottom branch + node -->
    <line x1="59" y1="69" x2="77" y2="69"
          stroke="#F2EBE0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="69" r="4" fill="#F2EBE0"/>

    <!-- LEFT HALF: Brain -->
    <path d="
      M 50,16
      C 46,9 38,5 30,7
      C 22,7 16,11 14,19
      C 6,19 2,27 4,37
      C 0,45 4,57 12,61
      C 8,71 14,83 26,87
      C 36,91 46,85 50,75
    " fill="none" stroke="#F2EBE0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top lobe divot -->
    <path d="M 28,9 Q 34,17 42,13"
          fill="none" stroke="#F2EBE0" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Middle fold -->
    <path d="M 6,47 Q 18,41 32,47 Q 40,50 48,47"
          fill="none" stroke="#F2EBE0" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Bottom lobe divot -->
    <path d="M 18,85 Q 28,77 38,81"
          fill="none" stroke="#F2EBE0" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
