<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Terracotta circle background -->
  <circle cx="32" cy="32" r="32" fill="#AA5022"/>

  <!-- Shield outline (white) -->
  <path d="M32 8 L52 16 L52 36 Q52 50 32 58 Q12 50 12 36 L12 16 Z"
        fill="none" stroke="#F2EBE0" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Vertical center divider -->
  <line x1="32" y1="9" x2="32" y2="57" stroke="#F2EBE0" stroke-width="1.6"/>

  <!-- LEFT: Brain (extends slightly outside shield) -->
  <path d="M30 18
           Q30 12 24 12
           Q15 12 13 20
           Q8 20 8 28
           Q8 36 16 38
           Q14 44 18 49
           Q22 54 28 52
           Q31 50 31 46"
        fill="none" stroke="#F2EBE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brain fold arcs -->
  <path d="M12 25 Q18 21 26 25" fill="none" stroke="#F2EBE0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10 34 Q16 30 24 34" fill="none" stroke="#F2EBE0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15 45 Q20 41 27 45" fill="none" stroke="#F2EBE0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- RIGHT: Circuit traces -->
  <circle cx="32" cy="34" r="2" fill="#F2EBE0"/>
  <!-- Trace upper-right -->
  <line x1="33" y1="33" x2="42" y2="24" stroke="#F2EBE0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="22" r="3.5" fill="#F2EBE0"/>
  <!-- Trace right -->
  <line x1="34" y1="34" x2="46" y2="34" stroke="#F2EBE0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="49" cy="34" r="3.5" fill="#F2EBE0"/>
  <!-- Trace lower-right -->
  <line x1="33" y1="35" x2="42" y2="44" stroke="#F2EBE0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="46" r="3.5" fill="#F2EBE0"/>
</svg>
